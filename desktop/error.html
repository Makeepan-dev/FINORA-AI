<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>FINORA — Backend Startup Error</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #020617;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 24px;
      box-sizing: border-box;
      text-align: center;
    }
    .card {
      max-width: 560px;
      background: #0f172a;

      padding: 28px;
    }
    h2 {
      color: #f87171;
      margin-top: 0;
    }
    pre {
      background: #020617;
      padding: 12px;
      border-radius: 8px;
      color: #cbd5e1;
      font-size: 12px;
      text-align: left;
      overflow-x: auto;
      max-height: 200px;

<body>
  <div class="card">
    <h2>Unable to Start FINORA Local Engine</h2>
    <p>The bundled FINORA FastAPI backend did not respond within the startup timeout.</p>
    <pre id="details">Check %APPDATA%\FINORA\backend.log for details.</pre>
  </div>

</html>
