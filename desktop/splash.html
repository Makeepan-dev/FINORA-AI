<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Starting FINORA...</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at top, #0f172a 0%, #020617 100%);
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
    }
    .logo-box {
      width: 68px;
      height: 68px;
      border-radius: 18px;
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      font-weight: 800;
      color: #020617;
      box-shadow: 0 12px 35px rgba(16, 185, 129, 0.35);
      margin-bottom: 20px;
    }
    h1 {
      margin: 0 0 8px 0;
      font-size: 24px;
      letter-spacing: 0.08em;
    }
    p {
      margin: 0 0 24px 0;
      font-size: 13px;
      color: #94a3b8;
    }
    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid rgba(16, 185, 129, 0.2);
      border-top-color: #10b981;
      border-radius: 50%;
      animation: spin 0.85s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="logo-box">F</div>
  <h1>FINORA</h1>
  <p>Initializing local Financial Intelligence &amp; SQLite engine...</p>
  <div class="spinner"></div>
</body>
</html>
